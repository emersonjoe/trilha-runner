name: release
# A tag `vX.Y.Z` becomes a GitHub release with one static binary per
# platform, a checksum file and the CHANGELOG section of that version as the
# notes. Nothing is published before the tag is proven to be the version the
# binary reports (TestVersionMatchesTag) and the suite is green.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
      # The gate: the tag must be the version compiled into the binary, and
      # the newest CHANGELOG section must be that version.
      - name: The tag is the version in cmd/trilha-runner/main.go
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: go test ./cmd/trilha-runner -run 'TestVersionMatchesTag|TestVersionMatchesTheNewestChangelogEntry' -count=1 -v
      - name: The CHANGELOG has a section for this version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: grep -q "^## ${RELEASE_TAG#v} — " CHANGELOG.md || { echo "CHANGELOG.md has no '## ${RELEASE_TAG#v} — <date>' section"; exit 1; }
      - run: make test
        env:
          TRILHA_REQUIRE_DOCKER: "1"
  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
      - name: Build trilha-runner ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${version}" \
            -o "dist/trilha-runner_${version}_${GOOS}_${GOARCH}" ./cmd/trilha-runner
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trilha-runner-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: trilha-runner-*
          path: dist
          merge-multiple: true
      - name: Checksums and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          (cd dist && sha256sum trilha-runner_* > sha256sums.txt && cat sha256sums.txt)
          # The notes are the CHANGELOG section of this version: from its
          # heading to the next one, heading excluded.
          awk -v v="$version" '$0 ~ "^## " v " " {p=1; next} /^## / {p=0} p' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${version}"; exit 1; }
          cat notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/trilha-runner_* dist/sha256sums.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "trilha-runner ${RELEASE_TAG#v}" --notes-file notes.md
